name: Build and Release PhoneBook

# 触发：
#   1) 推送代码到 main/master 分支 -> 自动构建最新可执行文件
#   2) 当前版本 Release 不存在时，自动发布到 GitHub Release
#   3) 手动在 Actions 页面点 "Run workflow" -> 按输入标签发布/更新 Release
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布到 Release 的标签名（如 v20260919-V2）。留空则自动使用源代码 version.go 里的版本号。'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            out: PhoneBook
          - goos: windows
            goarch: amd64
            out: PhoneBook.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
      - name: Validate version metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          version = re.search(r'const Version = "([^"]+)"', Path("version.go").read_text(encoding="utf-8"))
          if not version:
              raise SystemExit("无法读取 version.go 中的 Version")
          ver = version.group(1)

          m = re.fullmatch(r'(\d{4})(\d{2})(\d{2})-V(\d+)', ver)
          if not m:
              raise SystemExit(f"版本号格式不符合要求: {ver}")
          expected = f"{m.group(1)}.{int(m.group(2))}.{int(m.group(3))}.{m.group(4)}"

          data = json.loads(Path("winres/winres.json").read_text(encoding="utf-8"))
          manifest_ver = data["RT_MANIFEST"]["#1"]["0409"]["identity"]["version"]
          fixed = data["RT_VERSION"]["#1"]["0000"]["fixed"]
          info = data["RT_VERSION"]["#1"]["0000"]["info"]["0409"]

          actuals = [manifest_ver, fixed["file_version"], fixed["product_version"]]
          if any(x != expected for x in actuals):
              raise SystemExit(f"Windows 数字版本不一致: {actuals}, expected={expected}")

          if info["FileVersion"] != ver or info["ProductVersion"] != ver:
              raise SystemExit(f"Windows 字符串版本不一致: {info['FileVersion']} / {info['ProductVersion']}, expected={ver}")

          print(f"版本元数据校验通过: {ver} / {expected}")
          PY


      - name: Run Go tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      # 本项目前端以 base64 内嵌于 frontend_embed.go（go:embed 不可用）。
      # CI 每次都重新生成并强制校验仓库中的 frontend_embed.go 与源码一致。
      - name: Regenerate frontend embed (must stay in sync)
        run: |
          python3 gen_frontend.py
          git diff --exit-code -- frontend_embed.go

      - name: Validate frontend JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("frontend/index.html").read_text(encoding="utf-8")
          start = html.find("<script>")
          end = html.find("</script>", start)
          if start < 0 or end < 0:
              raise SystemExit("未找到前端主脚本")
          Path("/tmp/phonebook-frontend.js").write_text(html[start + len("<script>"):end], encoding="utf-8")
          PY
          node --check /tmp/phonebook-frontend.js

      # Windows 可执行文件的「详细信息」版本号来自 winres/winres.json，
      # 需先用 go-winres 编译进 rsrc_windows_amd64.syso。
      - name: Install go-winres (Windows version resource)
        if: matrix.goos == 'windows'
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate Windows version resource
        if: matrix.goos == 'windows'
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go-winres make --arch amd64 --out rsrc

      # 交叉编译。Linux 构建时仓库里虽存在 .syso，但 Go 只对 windows/amd64
      # 链接该资源，Linux 二进制不受影响。
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o "${{ matrix.out }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  # 自动发布策略：
  # - push：当前 version.go 对应的 Release 不存在时自动发布；
  # - workflow_dispatch：始终按 release_tag（或 version.go）发布/更新。
  release:
    name: Publish to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (读取 version.go)
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            VER=$(grep -oE 'Version = "[^"]+"' version.go | head -1 | sed -E 's/Version = "([^"]+)"/\1/')
            TAG="v${VER}"
            echo "从 version.go 取到版本号：$VER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          overwrite_files: true
          files: |
            artifacts/PhoneBook
            artifacts/PhoneBook.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
