name: Build and Release PhoneBook

# 触发：
#   1) 推送代码到 main/master 分支 -> 自动构建最新可执行文件
#   2) 当前版本 Release 不存在时，自动发布到 GitHub Release
#   3) 手动在 Actions 页面点 "Run workflow" -> 按输入标签发布/更新 Release
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布到 Release 的标签名（如 v20260813-V3）。留空则自动使用源代码 version.go 里的版本号。'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            out: PhoneBook
          - goos: windows
            goarch: amd64
            out: PhoneBook.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'

      # 本项目前端以 base64 内嵌于 frontend_embed.go（go:embed 不可用）。
      # CI 每次都重新生成，确保二进制一定包含最新的 frontend/index.html，
      # 不依赖你本地是否记得运行脚本；若仓库里的 frontend_embed.go 滞后，
      # 这里只给出警告、不会中断构建。
      - name: Regenerate frontend embed (always in sync with index.html)
        run: |
          python3 gen_frontend.py
          if ! git diff --quiet frontend_embed.go; then
            echo "::warning::frontend_embed.go 与 frontend/index.html 不同步，已用最新内容重新构建。建议本地运行 python gen_frontend.py 并提交，使仓库内保持一致。"
          fi

      # Windows 可执行文件的「详细信息」版本号来自 winres/winres.json，
      # 需先用 go-winres 编译进 rsrc_windows_amd64.syso。
      - name: Install go-winres (Windows version resource)
        if: matrix.goos == 'windows'
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate Windows version resource
        if: matrix.goos == 'windows'
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go-winres make --arch amd64 --out rsrc

      # 交叉编译。Linux 构建时仓库里虽存在 .syso，但 Go 只对 windows/amd64
      # 链接该资源，Linux 二进制不受影响。
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o "${{ matrix.out }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  # 自动发布策略：
  # - push：当前 version.go 对应的 Release 不存在时自动发布；
  # - workflow_dispatch：始终按 release_tag（或 version.go）发布/更新。
  release:
    name: Publish to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (读取 version.go)
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            VER=$(grep -oE 'Version = "[^"]+"' version.go | head -1 | sed -E 's/Version = "([^"]+)"/\1/')
            TAG="v${VER}"
            echo "从 version.go 取到版本号：$VER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          overwrite_files: true
          files: |
            artifacts/PhoneBook
            artifacts/PhoneBook.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
