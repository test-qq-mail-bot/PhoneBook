<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneBook 通讯录</title>
<style>
  :root {
    --primary: #3867f5;
    --primary-hover: #2854d6;
    --primary-light: #edf2ff;
    --primary-soft: #f5f7ff;
    --text: #172033;
    --text-secondary: #59657a;
    --text-muted: #8b95a7;
    --border: #dfe4ee;
    --border-light: #edf0f5;
    --bg: #f5f7fb;
    --card: #ffffff;
    --surface: #f8faff;
    --danger: #d94a5f;
    --danger-bg: #fff1f3;
    --warning: #b98118;
    --warning-bg: #fff8e8;
    --success: #23845b;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.04);
    --shadow: 0 8px 28px rgba(31,42,68,.08);
    --shadow-md: 0 18px 48px rgba(22,32,51,.18);
    --radius: 14px;
    --radius-sm: 10px;
    --radius-xs: 7px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { min-height: 100%; }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text",
      "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background:
      radial-gradient(circle at top left, rgba(56,103,245,.07), transparent 34rem),
      var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }

  .pb-app {
    width: min(1320px, calc(100% - 32px));
    margin: 28px auto;
    padding-bottom: 24px;
  }

  .pb-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 22px 24px;
    color: var(--text);
    background: rgba(255,255,255,.92);
    border: 1px solid rgba(223,228,238,.9);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .pb-header::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 5px;
    background: linear-gradient(180deg, #3867f5, #6b7ff8);
  }
  .pb-header-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  .pb-header-icon {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--primary-light);
    color: var(--primary);
    border: 1px solid #d9e2ff;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -.4px;
  }
  .pb-header-title {
    font-size: 21px;
    line-height: 1.2;
    font-weight: 750;
    letter-spacing: -.4px;
  }
  .pb-header-subtitle {
    margin-top: 4px;
    color: var(--text-muted);
    font-size: 12.5px;
  }
  .pb-header-help-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: 0 0 auto;
    padding: 9px 14px;
    background: #fff;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: .16s ease;
  }
  .pb-header-help-btn:hover {
    color: var(--primary);
    border-color: #b9c7f7;
    background: var(--primary-soft);
    transform: translateY(-1px);
  }
  .pb-header-help-icon { width: 15px; height: 15px; fill: currentColor; }

  .pb-error-panel, .pb-missing-panel {
    margin-top: 12px;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm);
  }
  .pb-error-panel {
    background: var(--danger-bg);
    border: 1px solid #f1cbd2;
    color: #9e2e40;
    padding: 14px 16px;
  }
  .pb-error-title {
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .pb-error-item {
    margin: 4px 0;
    font-size: 13px;
    line-height: 1.6;
  }
  .pb-missing-panel {
    background: var(--warning-bg);
    border: 1px solid #f0dfb7;
    color: #765714;
    padding: 14px 16px;
    font-size: 13.5px;
  }
  .pb-missing-panel b { color: #5e4811; }

  .pb-connerr-panel {
    margin-top: 12px;
    padding: 15px 16px;
    border: 1px solid #f0c8cf;
    border-radius: var(--radius-sm);
    background: var(--danger-bg);
    color: #9e2e40;
    font-size: 13.5px;
    line-height: 1.7;
    box-shadow: var(--shadow-sm);
  }
  .pb-connerr-panel code {
    padding: 2px 6px;
    border: 1px solid #efc7ce;
    border-radius: 5px;
    background: #fff;
    font-size: 12.5px;
  }

  .pb-card {
    margin-top: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .pb-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 20px;
    background: #fff;
    border-bottom: 1px solid var(--border-light);
  }
  .pb-toolbar-main {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 1 1 auto;
    min-width: 0;
  }
  .pb-toolbar-title {
    flex: 0 0 auto;
    font-size: 15px;
    font-weight: 750;
    color: var(--text);
  }
  .pb-search-box {
    position: relative;
    flex: 1 1 auto;
    min-width: 240px;
    max-width: 540px;
  }
  .pb-search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    width: 17px;
    height: 17px;
    transform: translateY(-50%);
    fill: var(--text-muted);
    pointer-events: none;
  }
  .pb-toolbar-search {
    width: 100%;
    padding: 10px 13px 10px 38px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    color: var(--text);
    background: var(--surface);
    outline: none;
    transition: .16s ease;
  }
  .pb-toolbar-search::placeholder { color: #a2aaba; }
  .pb-toolbar-search:hover { border-color: #cbd3e2; }
  .pb-toolbar-search:focus {
    border-color: #9fb1f5;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(56,103,245,.10);
  }
  .pb-toolbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }

  .pb-btn {
    min-height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 14px;
    border: 1px solid var(--primary);
    border-radius: var(--radius-xs);
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    font-size: 13px;
    font-weight: 650;
    white-space: nowrap;
    transition: .16s ease;
  }
  .pb-btn:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
    box-shadow: 0 5px 14px rgba(56,103,245,.18);
    transform: translateY(-1px);
  }
  .pb-btn:active { transform: translateY(0); }
  .pb-btn:disabled {
    background: #c7ccd5;
    border-color: #c7ccd5;
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }
  .pb-btn-outline {
    background: #fff;
    border-color: var(--border);
    color: var(--text-secondary);
  }
  .pb-btn-outline:hover {
    background: var(--primary-soft);
    border-color: #b9c7f7;
    color: var(--primary);
    box-shadow: none;
  }
  .pb-btn-icon { width: 15px; height: 15px; fill: currentColor; }
  .pb-btn-sm { min-height: 32px; padding: 7px 11px; font-size: 12px; }

  .pb-table-wrapper {
    overflow: auto;
    background: #fff;
  }
  .pb-table {
    width: 100%;
    min-width: 980px;
    border-collapse: separate;
    border-spacing: 0;
  }
  .pb-table-head-cell {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 11px 12px;
    text-align: left;
    background: #f8faff;
    border-bottom: 1px solid var(--border);
    color: #68748a;
    user-select: none;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 750;
    letter-spacing: .02em;
  }
  .pb-table-head-cell:first-child { padding-left: 16px; }
  .pb-table-head-cell:last-child { padding-right: 16px; }
  .pb-table-head-cell:hover { background: #f1f5ff; }
  .pb-col-head-wrap {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 28px;
  }
  .pb-col-head-label {
    color: inherit;
    cursor: pointer;
  }
  .pb-table-sort-icon {
    min-width: 12px;
    color: var(--primary);
    font-size: 13px;
    font-weight: 800;
    line-height: 1;
  }
  .pb-col-filter-btn {
    width: 29px;
    height: 29px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 5px;
    border: 1px solid #d8deea;
    border-radius: 7px;
    background: #fff;
    color: #8892a5;
    cursor: pointer;
    transition: .16s ease;
  }
  .pb-col-filter-icon { width: 15px; height: 15px; fill: currentColor; }
  .pb-col-filter-btn:hover {
    color: var(--primary);
    border-color: #adbbef;
    background: var(--primary-soft);
  }
  .pb-col-filter-btn.pb-active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 0 0 3px rgba(56,103,245,.12);
  }

  .pb-table-row:nth-child(even) { background: #fcfdff; }
  .pb-table-row { transition: background .12s ease; }
  .pb-table-row:hover { background: #f2f6ff !important; }
  .pb-table-cell {
    max-width: 300px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-light);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
    font-size: 13.5px;
  }
  .pb-table-cell:first-child { padding-left: 16px; }
  .pb-table-cell:last-child { padding-right: 16px; }
  .pb-table-op-actions {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .pb-table-edit-btn, .pb-table-delete-btn {
    min-height: 31px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 12px;
    font-weight: 650;
    transition: .16s ease;
  }
  .pb-table-edit-btn:hover {
    color: var(--primary);
    border-color: #b9c7f7;
    background: var(--primary-soft);
  }
  .pb-table-delete-btn {
    color: var(--danger);
    border-color: #efcbd2;
    background: #fff7f8;
  }
  .pb-table-delete-btn:hover {
    color: #fff;
    border-color: var(--danger);
    background: var(--danger);
  }

  .pb-pagination {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 12px 18px;
    background: #fbfcfe;
    border-top: 1px solid var(--border-light);
  }
  .pb-pagination-info {
    color: var(--text-secondary);
    font-size: 12.5px;
    font-weight: 600;
  }
  .pb-pagination-size-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--text-secondary);
    font-size: 12.5px;
    font-weight: 600;
  }
  .pb-pagination-size-select {
    min-height: 34px;
    padding: 5px 30px 5px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    background: #fff;
    cursor: pointer;
    outline: none;
  }
  .pb-pagination-size-select:focus {
    border-color: #9fb1f5;
    box-shadow: 0 0 0 4px rgba(56,103,245,.10);
  }
  .pb-page-nav {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    margin-left: auto;
  }
  .pb-pagination-btn {
    min-width: 38px;
    min-height: 34px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 650;
    transition: .16s ease;
  }
  .pb-pagination-btn:hover:not(:disabled) {
    color: var(--primary);
    border-color: #b9c7f7;
    background: var(--primary-soft);
  }
  .pb-pagination-btn:disabled {
    color: var(--text-muted);
    background: #f4f5f8;
    border-color: #eceef2;
    cursor: not-allowed;
  }
  .pb-page-btn {
    min-width: 34px;
    min-height: 34px;
    padding: 6px 9px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 650;
  }
  .pb-page-btn:hover {
    background: var(--primary-soft);
    color: var(--primary);
  }
  .pb-page-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 4px 10px rgba(56,103,245,.18);
  }
  .pb-page-btn:disabled { cursor: default; }
  .pb-page-ellipsis {
    min-width: 18px;
    text-align: center;
    color: var(--text-muted);
  }

  .pb-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding: 10px 14px;
    color: #68748a;
    font-size: 12px;
  }
  .pb-footer-icon { width: 15px; height: 15px; fill: currentColor; flex: 0 0 auto; }

  .pb-empty-tip {
    padding: 58px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    background: #fff;
  }

  .pb-modal-mask {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(20,28,45,.52);
    backdrop-filter: blur(5px);
  }
  .pb-modal-mask.pb-show { display: flex; }
  .pb-modal-edit, .pb-modal-help, .pb-modal-filter {
    width: min(560px, 100%);
    max-height: min(84vh, 760px);
    overflow: auto;
    padding: 24px;
    border: 1px solid rgba(223,228,238,.96);
    border-radius: 16px;
    background: #fff;
    box-shadow: var(--shadow-md);
    animation: pbModalIn .18s ease-out;
  }
  @keyframes pbModalIn {
    from { opacity: 0; transform: translateY(8px) scale(.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .pb-modal-title {
    margin: 0 0 4px;
    color: var(--text);
    font-size: 18px;
    font-weight: 760;
    letter-spacing: -.2px;
  }
  .pb-modal-edit-form {
    display: grid;
    gap: 13px;
    margin: 20px 0 4px;
  }
  .pb-modal-edit-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .pb-modal-edit-field label {
    color: var(--text-secondary);
    font-size: 12.5px;
    font-weight: 700;
  }
  .pb-modal-edit-field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: .16s ease;
  }
  .pb-modal-edit-field input:hover { border-color: #cbd3e2; }
  .pb-modal-edit-field input:focus {
    border-color: #9fb1f5;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(56,103,245,.10);
  }
  .pb-modal-actions {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 18px;
  }
  .pb-modal-actions > #editDelete {
    margin-right: auto;
  }

  .pb-filter-toolbar {
    margin: 16px 0 4px;
    padding: 12px;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    background: var(--surface);
  }
  .pb-filter-search {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    outline: none;
  }
  .pb-filter-search:focus {
    border-color: #9fb1f5;
    box-shadow: 0 0 0 4px rgba(56,103,245,.08);
  }
  .pb-filter-links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .pb-filter-links a {
    padding: 6px 9px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--primary);
    cursor: pointer;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    transition: .16s ease;
  }
  .pb-filter-links a:hover {
    border-color: #c9d4f7;
    background: var(--primary-light);
  }
  .pb-filter-options {
    display: grid;
    gap: 5px;
    margin: 14px 0;
    max-height: 46vh;
    overflow: auto;
    padding-right: 3px;
  }
  .pb-filter-opt {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 9px;
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
  }
  .pb-filter-opt:hover { background: var(--primary-soft); }
  .pb-filter-opt input {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--primary);
    flex: 0 0 auto;
  }
  .pb-filter-opt span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pb-filter-count { color: var(--text-muted); font-size: 12px; }

  .pb-modal-help-content {
    color: var(--text-secondary);
    font-size: 13.5px;
    line-height: 1.8;
  }
  .pb-modal-help-content h3 {
    margin: 17px 0 6px;
    color: var(--primary);
    font-size: 14px;
    font-weight: 750;
  }
  .pb-modal-help-content h3:first-child { margin-top: 6px; }
  .pb-modal-help-content p { margin: 0 0 8px; }
  .pb-modal-help-content code {
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 12px;
    font-family: "Cascadia Code", "Consolas", monospace;
  }

  @media (max-width: 900px) {
    .pb-toolbar { align-items: stretch; flex-direction: column; }
    .pb-toolbar-main { flex-direction: column; align-items: stretch; gap: 10px; }
    .pb-search-box { max-width: none; }
    .pb-toolbar-actions { flex-wrap: wrap; }
    .pb-toolbar-actions .pb-btn { flex: 1 1 130px; }
  }

  @media (max-width: 640px) {
    .pb-app {
      width: min(100% - 16px, 1320px);
      margin: 10px auto;
    }
    .pb-header {
      padding: 17px;
    }
    .pb-header-title { font-size: 18px; }
    .pb-header-subtitle { display: none; }
    .pb-header-help-btn { padding: 8px 10px; }
    .pb-header-help-btn span { display: none; }
    .pb-card { margin-top: 10px; }
    .pb-toolbar, .pb-pagination { padding: 12px; }
    .pb-toolbar-actions { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    .pb-toolbar-actions .pb-btn { width: 100%; }
    .pb-table-cell, .pb-table-head-cell { padding: 8px 12px; }
    .pb-table-cell:first-child, .pb-table-head-cell:first-child { padding-left: 12px; }
    .pb-table-cell:last-child, .pb-table-head-cell:last-child { padding-right: 12px; }
    .pb-pagination { align-items: flex-start; flex-wrap: wrap; }
    .pb-pagination-info { width: 100%; }
    .pb-page-nav { width: 100%; margin-left: 0; }
    .pb-modal-mask { padding: 10px; }
    .pb-modal-edit, .pb-modal-help, .pb-modal-filter { padding: 18px; border-radius: 14px; }
  }
</style>
</head>
<body id="pbBody">
<div class="pb-app" id="pbApp">
  <div class="pb-header" id="pbHeader">
    <div class="pb-header-left" id="pbHeaderLeft">
      <div class="pb-header-icon" id="pbBrandIcon">P</div>
      <div id="pbHeaderText"><div class="pb-header-title" id="pbTitle">PhoneBook 通讯录</div><div class="pb-header-subtitle" id="pbSubtitle">轻量级内部电话通讯录 · 本地编辑</div></div>
    </div>
    <button class="pb-header-help-btn" id="helpBtn" type="button" aria-label="打开帮助"><svg class="pb-header-help-icon" id="helpIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9Zm.1 15.4a1.15 1.15 0 1 1 0-2.3 1.15 1.15 0 0 1 0 2.3Zm1.7-6.5-.9.7c-.8.6-1 1.1-1 2.1h-1.8c0-1.5.4-2.4 1.4-3.2l1.1-.9c.5-.4.8-.8.8-1.4a1.55 1.55 0 0 0-3.1 0H8.4a3.35 3.35 0 0 1 6.7 0c0 1.2-.5 2-1.3 2.7Z"/></svg><span id="helpBtnText">帮助</span></button>
  </div>

  <div class="pb-error-panel" id="errorPanel" style="display:none;"><div id="errorTitle" class="pb-error-title">警告：contacts.yaml 解析失败，请管理员修复以下位置：</div>
    <div id="errorList"></div>
  </div>

  <div class="pb-missing-panel" id="missingPanel" style="display:none;">
    提示：<b>contacts.yaml 文件不存在</b>。您可以先点「新增联系人」录入数据，再点「导出 YAML」生成该文件；或直接导入一份合法的 contacts.yaml。当前表格为空。
  </div>

  <div class="pb-card" id="contactCard">
    <div class="pb-toolbar" id="contactToolbar">
      <div class="pb-toolbar-main" id="toolbarMain">
        <div class="pb-toolbar-title" id="toolbarTitle">联系人列表</div>
        <div class="pb-search-box" id="searchBox">
          <svg class="pb-search-icon" id="searchIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="m16.2 14.8 4.3 4.3-1.4 1.4-4.3-4.3a7 7 0 1 1 1.4-1.4ZM10.5 16a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11Z"/></svg>
          <input class="pb-toolbar-search" id="searchInput" placeholder="搜索（跨所有字段实时过滤）...">
        </div>
      </div>
      <div class="pb-toolbar-actions" id="toolbarActions">
        <button class="pb-btn pb-btn-outline" id="importBtn" type="button"><svg class="pb-btn-icon" id="importIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.2l3.4-3.4 1.4 1.4-5.8 5.8-5.8-5.8 1.4-1.4 3.4 3.4V3h2Zm-6 16h12v2H6v-2Z"/></svg><span id="importBtnText">导入 YAML</span></button>
        <button class="pb-btn pb-btn-outline" id="exportBtn" type="button"><svg class="pb-btn-icon" id="exportIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V10.8L8.6 14.2 7.2 12.8 13 7l5.8 5.8-1.4 1.4-3.4-3.4V21h-2ZM6 3h12v2H6V3Z"/></svg><span id="exportBtnText">导出 YAML</span></button>
        <button class="pb-btn" id="addBtn" type="button"><svg class="pb-btn-icon" id="addIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg><span id="addBtnText">新增联系人</span></button>
      </div>
      <input type="file" id="importFile" accept=".yaml,.yml" style="display:none;" aria-hidden="true">
    </div>

    <div class="pb-table-wrapper" id="tableRegion">
      <table class="pb-table" id="contactTable">
        <thead id="tableHeadSection"><tr class="pb-table-head" id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="pb-empty-tip" id="emptyTip" style="display:none;">暂无符合条件的数据</div>
    </div>

    <div class="pb-pagination" id="paginationBar">
      <span class="pb-pagination-info" id="totalInfo"></span>
      <label class="pb-pagination-size-label" id="pageSizeLabel">
        每页
            <select class="pb-pagination-size-select" id="pageSize">
          <option value="10">10</option>
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select> 条/页
      </label>
      <div class="pb-page-nav" id="pageNav"></div>
    </div>
  </div>

  <div class="pb-footer" id="pbFooter"><svg class="pb-footer-icon" id="footerInfoIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-6h2v6Zm0-8h-2V7h2v2Z"/></svg>
    本地修改不会保存，刷新页面将恢复服务器数据。如需永久修改，请导出 YAML 文件并联系管理员。
  </div>
</div>

<!-- 编辑/新增弹窗 -->
<div class="pb-modal-mask" id="editMask">
  <div class="pb-modal-edit" id="editDialog">
    <div class="pb-modal-title" id="editTitle">编辑联系人</div>
    <form class="pb-modal-edit-form" id="editForm"></form>
    <div class="pb-modal-actions" id="editActions">
      <button class="pb-table-delete-btn" id="editDelete" type="button" style="display:none;">删除联系人</button>
      <button class="pb-btn pb-btn-outline" id="editCancel">取消</button>
      <button class="pb-btn" id="editSave">保存</button>
    </div>
  </div>
</div>

<!-- 列筛选弹窗 -->
<div class="pb-modal-mask" id="filterModal">
  <div class="pb-modal-filter" id="filterDialog">
    <div class="pb-modal-title" id="filterModalTitle">筛选</div>
    <div class="pb-filter-toolbar" id="filterToolbar">
      <input type="text" id="filterSearch" class="pb-filter-search" placeholder="包含任一关键字，空格分隔" />
      <div class="pb-filter-links" id="filterLinks">
        <a id="flAsc">升序</a>
        <a id="flDesc">降序</a>
        <a id="flAll">全选</a>
        <a id="flInv">反选</a>
        <a id="flDup">重复项</a>
        <a id="flUni">唯一项</a>
      </div>
    </div>
    <div class="pb-filter-options" id="filterOptions"></div>
    <div class="pb-modal-actions" id="filterActions">
      <button class="pb-btn pb-btn-outline" id="filterCancel">取消</button>
      <button class="pb-btn" id="filterApply">确定</button>
    </div>
  </div>
</div>

<!-- 帮助弹窗 -->
<div class="pb-modal-mask" id="helpMask">
  <div class="pb-modal-help" id="helpDialog">
    <div class="pb-modal-title">PhoneBook 使用帮助</div>
    <div class="pb-modal-help-content" id="helpContent"></div>
    <div class="pb-modal-actions" id="helpActions">
      <button class="pb-btn" id="helpClose">关闭</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function () {
  var state = {
    config: null,
    contacts: [],
    errors: [],
    status: "ok",
    search: "",
    sortKey: null,
    sortDir: "none",
    filters: {},
    filterKey: null,
    page: 1,
    pageSize: 25,
    dirty: false,
    editIndex: -1
  };

  function dbg(msg) {
    if (state.config && state.config.debug) { console.log("[PB-DEBUG] " + msg); }
  }
  function setDirty(v) {
    if (state.dirty !== v) { state.dirty = v; dbg("dirty 状态变更：" + (!v) + " -> " + v); }
  }
  function $(id) { return document.getElementById(id); }
  function safeIdPart(value) {
    return String(value == null ? "" : value).replace(/[^a-zA-Z0-9_-]/g, "_");
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---------- 初始化 ----------
  function init() {
    fetch("/api/data").then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (data) {
      if (!data.config || !Array.isArray(data.config.fields)) {
        throw new Error("服务器返回的配置无效：缺少 config.fields");
      }
      state.config = data.config;
      var defaultSortField = data.config.fields.find(function (f) { return f.key === "phone_id"; }) || data.config.fields[0];
      state.sortKey = defaultSortField ? defaultSortField.key : null;
      state.sortDir = defaultSortField ? "asc" : "none";
      state.status = data.status;
      state.contacts = Array.isArray(data.contacts) ? data.contacts : [];
      state.errors = Array.isArray(data.errors) ? data.errors : [];
      dbg("数据加载完成，共 " + state.contacts.length + " 条联系人");
      dbg("字段定义：" + JSON.stringify(state.config.fields));
      if (state.status === "error") {
        showErrorPanel();
        setToolbarDisabled(true);
        renderEmpty();
      } else if (state.status === "missing") {
        $("missingPanel").style.display = "block";
        render();
      } else {
        render();
      }
    }).catch(function (e) {
      console.error("[PB-ERROR] 加载 /api/data 失败:", e);
      var msg = "无法连接服务器。若浏览器提示「证书不安全」，这是自签证书的正常现象，并非程序故障：" +
        "请在地址栏点击「高级」->「继续前往（不安全）」后再刷新本页面。" +
        "如需彻底消除提示，可将 certs/server.crt 导入系统/浏览器信任库，或在 config.yaml 中将 https_enabled 改为 false 走 HTTP。";
      console.warn("[PB-NOTICE] " + msg);
      showConnError(msg);
    });
  }
  function showConnError(msg) {
    var div = document.createElement("div");
    div.id = "connectionError";
    div.className = "pb-connerr-panel";
    div.innerHTML = "<b id=\"connectionErrorTitle\">连接失败</b><br><span id=\"connectionErrorMessage\">" + escapeHtml(msg) + "</span>";
    var app = $("errorPanel").parentNode;
    app.insertBefore(div, $("errorPanel"));
  }

  function showErrorPanel() {
    $("errorPanel").style.display = "block";
    var html = "";
    state.errors.forEach(function (e, idx) {
      var where = e.line > 0 ? ("第" + e.line + "行：") : "";
      html += '<div class="pb-error-item" id="error-item-' + idx + '">' + escapeHtml(where + e.message) + '</div>';
    });
    $("errorList").innerHTML = html;
  }
  function setToolbarDisabled(d) {
    ["importBtn", "exportBtn", "addBtn"].forEach(function (id) { $(id).disabled = d; });
    $("searchInput").disabled = d;
  }
  function renderEmpty() {
    $("tableHead").innerHTML = "";
    $("tableBody").innerHTML = "";
    $("emptyTip").style.display = "block";
    updatePagination(0);
  }

  // ---------- 表头（动态 + 列筛选按钮） ----------
  function renderHead() {
    var head = $("tableHead");
    head.innerHTML = "";
    state.config.fields.forEach(function (f) {
      var th = document.createElement("th");
      var idKey = safeIdPart(f.key);
      th.id = "table-head-" + idKey;
      th.className = "pb-table-head-cell";
      th.setAttribute("data-key", f.key);
      th.addEventListener("click", function (e) {
        if (e.target.closest && e.target.closest(".pb-col-filter-btn")) return;
        onSort(f.key);
      });

      var wrap = document.createElement("div");
      wrap.id = "table-head-wrap-" + idKey;
      wrap.className = "pb-col-head-wrap";

      var label = document.createElement("span");
      label.id = "table-head-label-" + idKey;
      label.className = "pb-col-head-label";
      label.textContent = f.label;

      var sortIcon = "";
      if (state.sortKey === f.key && (state.sortDir === "asc" || state.sortDir === "desc")) {
        sortIcon = state.sortDir === "asc" ? " ↑" : " ↓";
      }
      var sortSpan = document.createElement("span");
      sortSpan.id = "table-sort-" + idKey;
      sortSpan.className = "pb-table-sort-icon";
      sortSpan.textContent = sortIcon;

      var filterBtn = document.createElement("button");
      filterBtn.type = "button";
      filterBtn.id = "table-filter-" + idKey;
      filterBtn.className = "pb-col-filter-btn" + (hasEffectiveFilter(f.key) ? " pb-active" : "");
      filterBtn.setAttribute("aria-label", "筛选" + f.label);
      filterBtn.setAttribute("title", "筛选" + f.label);
      filterBtn.innerHTML = '<svg class="pb-col-filter-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6.5 7.5v5.8l-3 1.7v-7.5L4 5z"></path></svg>';
      filterBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        openFilterModal(f.key);
      });

      wrap.appendChild(label);
      wrap.appendChild(sortSpan);
      wrap.appendChild(filterBtn);
      th.appendChild(wrap);
      head.appendChild(th);
    });

    var thOp = document.createElement("th");
    thOp.className = "pb-table-head-cell";
    thOp.textContent = "操作";
    head.appendChild(thOp);
  }
  // ---------- 列筛选弹框 ----------
  function openFilterModal(key) {
    state.filterKey = key;
    var field = state.config.fields.filter(function (f) { return f.key === key; })[0];
    if (!field) return;

    $("filterModalTitle").textContent = "筛选：" + field.label;
    var opts = $("filterOptions");
    opts.innerHTML = "";

    var selected = state.filters[key] || [];
    var baseRows = filterBaseRows(key);
    var counts = valueCounts(baseRows, key);
    var values = Object.keys(counts);

    selected.forEach(function (v) {
      if (!Object.prototype.hasOwnProperty.call(counts, v)) {
        counts[v] = 0;
        values.push(v);
      }
    });
    values.sort(function (a, b) { return a.localeCompare(b, "zh-Hans-CN"); });

    values.forEach(function (v, idx) {
      var optionId = "pb-filter-option-" + safeIdPart(key) + "-" + idx;
      var lab = document.createElement("label");
      lab.id = optionId;
      lab.className = "pb-filter-opt";
      lab.setAttribute("data-val", v);

      var inp = document.createElement("input");
      inp.id = optionId + "-input";
      inp.type = "checkbox";
      inp.className = "opt";
      inp.value = v;
      inp.checked = selected.indexOf(v) !== -1;

      var span = document.createElement("span");
      span.id = optionId + "-label";
      var cnt = counts[v];
      span.textContent = (v === "" ? "(空)" : v) + (cnt > 1 ? " (" + cnt + ")" : "");

      lab.appendChild(inp);
      lab.appendChild(span);
      opts.appendChild(lab);
    });

    var search = $("filterSearch");
    search.value = "";
    search.oninput = function () {
      var kws = search.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      Array.prototype.forEach.call(opts.querySelectorAll(".pb-filter-opt"), function (lab) {
        var raw = lab.getAttribute("data-val") || "";
        var hit = kws.length === 0 || kws.some(function (k) {
          return raw.toLowerCase().indexOf(k) !== -1;
        });
        lab.style.display = hit ? "" : "none";
      });
    };

    function visibleBoxes() {
      return Array.prototype.filter.call(opts.querySelectorAll(".pb-filter-opt"), function (lab) {
        return lab.style.display !== "none";
      }).map(function (lab) {
        return lab.querySelector("input.opt");
      });
    }

    function sortFilterOptions(dir) {
      var nodes = Array.prototype.slice.call(opts.querySelectorAll(".pb-filter-opt"));
      nodes.sort(function (a, b) {
        var av = a.getAttribute("data-val") || "";
        var bv = b.getAttribute("data-val") || "";
        return av.localeCompare(bv, "zh-Hans-CN") * dir;
      });
      nodes.forEach(function (node) { opts.appendChild(node); });
    }

    $("flAsc").onclick = function () { sortFilterOptions(1); };
    $("flDesc").onclick = function () { sortFilterOptions(-1); };
    $("flAll").onclick = function () { visibleBoxes().forEach(function (cb) { cb.checked = true; }); };
    $("flInv").onclick = function () { visibleBoxes().forEach(function (cb) { cb.checked = !cb.checked; }); };
    $("flDup").onclick = function () { visibleBoxes().forEach(function (cb) { cb.checked = counts[cb.value] > 1; }); };
    $("flUni").onclick = function () { visibleBoxes().forEach(function (cb) { cb.checked = counts[cb.value] === 1; }); };

    $("filterModal").classList.add("pb-show");
  }

  function filterBaseRows(excludeKey) {
    var rows = state.contacts;

    if (state.search) {
      var q = state.search.toLowerCase();
      rows = rows.filter(function (c) {
        return state.config.fields.some(function (f) {
          return String(c[f.key] == null ? "" : c[f.key]).toLowerCase().indexOf(q) !== -1;
        });
      });
    }

    Object.keys(state.filters).forEach(function (k) {
      if (k === excludeKey) return;
      var v = state.filters[k];
      if (v && v.length) {
        rows = rows.filter(function (c) {
          return v.indexOf(String(c[k] == null ? "" : c[k])) !== -1;
        });
      }
    });
    return rows;
  }

  function hasEffectiveFilter(key) {
    var selected = state.filters[key];
    return Array.isArray(selected) && selected.length > 0;
  }

  function applyFilter() {
    var key = state.filterKey;
    var checked = [];
    Array.prototype.forEach.call($("filterOptions").querySelectorAll("input.opt"), function (inp) {
      if (inp.checked) checked.push(inp.value);
    });

    var baseCounts = valueCounts(filterBaseRows(key), key);
    var available = Object.keys(baseCounts);
    var selectsAllAvailable = available.length > 0 && available.every(function (v) {
      return checked.indexOf(v) !== -1;
    });

    if (checked.length === 0 || selectsAllAvailable) {
      delete state.filters[key];
    } else {
      state.filters[key] = checked;
    }

    state.page = 1;
    dbg("列筛选：" + key + " = [" + checked.join(", ") + "]，结果 " + currentRows().length + " 条");
    $("filterModal").classList.remove("pb-show");
    render();
  }

  function valueCounts(rows, key) {
    var m = {};
    rows.forEach(function (c) {
      var v = c[key] == null ? "" : String(c[key]);
      m[v] = (m[v] || 0) + 1;
    });
    return m;
  }


  // ---------- 数据处理流水线 ----------
  function currentRows() {
    var rows = filterBaseRows(null);
    if (state.sortKey && (state.sortDir === "asc" || state.sortDir === "desc")) {
      var key = state.sortKey;
      var dir = state.sortDir === "asc" ? 1 : -1;
      rows = rows.slice().sort(function (a, b) {
        var av = String(a[key] == null ? "" : a[key]);
        var bv = String(b[key] == null ? "" : b[key]);
        return av.localeCompare(bv, "zh-Hans-CN") * dir;
      });
    }
    return rows;
  }

  function onSort(key) {
    if (state.sortKey !== key) {
      state.sortKey = key;
      state.sortDir = "asc";
    } else if (state.sortDir === "asc") {
      state.sortDir = "desc";
    } else {
      state.sortDir = "asc";
    }
    dbg("排序：字段 " + key + "，方向 " + state.sortDir);
    render();
  }


  // ---------- 表格渲染 ----------
  function render() {
    renderHead();
    var rows = currentRows();
    var total = rows.length;
    var pages = Math.max(1, Math.ceil(total / state.pageSize));
    if (state.page > pages) state.page = pages;
    if (state.page < 1) state.page = 1;
    var start = (state.page - 1) * state.pageSize;
    var pageRows = rows.slice(start, start + state.pageSize);

    var body = $("tableBody");
    body.innerHTML = "";
    if (total === 0) {
      $("emptyTip").style.display = "block";
    } else {
      $("emptyTip").style.display = "none";
      pageRows.forEach(function (c) {
        var contactIndex = state.contacts.indexOf(c);
        var rowId = "contact-row-" + contactIndex;
        var tr = document.createElement("tr");
        tr.id = rowId;
        tr.className = "pb-table-row";
        // demands 4: 字段容错——缺字段显示空白值，可编辑
        state.config.fields.forEach(function (f) {
          var td = document.createElement("td");
          td.id = "contact-cell-" + contactIndex + "-" + safeIdPart(f.key);
          td.className = "pb-table-cell";
          td.textContent = c[f.key] == null ? "" : c[f.key];
          tr.appendChild(td);
        });
        var tdOp = document.createElement("td");
        tdOp.id = "contact-cell-" + contactIndex + "-actions";
        tdOp.className = "pb-table-cell";
        var actions = document.createElement("div");
        actions.id = "contact-actions-" + contactIndex;
        actions.className = "pb-table-op-actions";

        var editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.id = "contact-edit-" + contactIndex;
        editBtn.className = "pb-table-edit-btn";
        editBtn.textContent = "编辑";
        editBtn.addEventListener("click", function () { openEdit(c); });
        actions.appendChild(editBtn);

        var deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.id = "contact-delete-" + contactIndex;
        deleteBtn.className = "pb-table-delete-btn";
        deleteBtn.textContent = "删除";
        deleteBtn.addEventListener("click", function () { deleteContact(c); });
        actions.appendChild(deleteBtn);

        tdOp.appendChild(actions);
        tr.appendChild(tdOp);
        body.appendChild(tr);
      });
    }
    updatePagination(total);
  }

  function updatePagination(total) {
    var pages = Math.max(1, Math.ceil(total / state.pageSize));
    if (state.page > pages) state.page = pages;
    if (state.page < 1) state.page = 1;

    $("totalInfo").textContent = "共 " + total + " 条记录";
    var nav = $("pageNav");
    nav.innerHTML = "";

    // 第一页固定在最左侧。
    appendPageButton(nav, 1);

    var prev = document.createElement("button");
    prev.id = "page-prev";
    prev.type = "button";
    prev.className = "pb-pagination-btn";
    prev.textContent = "上一页";
    prev.disabled = state.page <= 1;
    prev.addEventListener("click", function () {
      if (state.page > 1) {
        state.page--;
        render();
      }
    });
    nav.appendChild(prev);

    if (pages <= 5) {
      for (var i = 2; i < pages; i++) appendPageButton(nav, i);
    } else {
      var start = Math.max(2, state.page - 2);
      var end = Math.min(pages - 1, state.page + 2);

      if (state.page <= 3) {
        start = 2;
        end = 5;
      }
      if (state.page >= pages - 2) {
        start = pages - 4;
        end = pages - 1;
      }

      if (start > 2) appendEllipsis(nav, "left");
      for (var p = start; p <= end; p++) appendPageButton(nav, p);
      if (end < pages - 1) appendEllipsis(nav, "right");
    }

    var next = document.createElement("button");
    next.id = "page-next";
    next.type = "button";
    next.className = "pb-pagination-btn";
    next.textContent = "下一页";
    next.disabled = state.page >= pages;
    next.addEventListener("click", function () {
      if (state.page < pages) {
        state.page++;
        render();
      }
    });
    nav.appendChild(next);

    // 最后一页固定在最右侧。
    if (pages > 1) appendPageButton(nav, pages);
  }


  function appendPageButton(nav, page) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.id = "page-button-" + page;
    btn.className = "pb-page-btn" + (page === state.page ? " active" : "");
    btn.textContent = String(page);
    if (page === state.page) btn.disabled = true;
    btn.addEventListener("click", function () {
      state.page = page;
      render();
    });
    nav.appendChild(btn);
  }

  function appendEllipsis(nav, side) {
    var span = document.createElement("span");
    span.id = "page-ellipsis-" + (side || "item");
    span.className = "pb-page-ellipsis";
    span.textContent = "…";
    nav.appendChild(span);
  }

  // ---------- 编辑 / 新增 ----------
  function openEdit(contact) {
    state.editIndex = state.contacts.indexOf(contact);
    $("editTitle").textContent = "编辑联系人";
    $("editDelete").style.display = "inline-flex";
    buildEditForm(contact);
    $("editMask").classList.add("pb-show");
  }
  function deleteContact(contact) {
    var index = state.contacts.indexOf(contact);
    if (index < 0) return;

    var phoneId = contact.phone_id == null ? "" : String(contact.phone_id);
    var name = contact.name == null ? "" : String(contact.name);
    var desc = [phoneId, name].filter(function (v) { return v !== ""; }).join(" / ");
    var message = desc ? "确定要删除联系人「" + desc + "」吗？" : "确定要删除这个联系人吗？";
    if (!window.confirm(message + "\n此删除仅作用于当前页面内存，刷新后会恢复服务器数据。")) return;

    state.contacts.splice(index, 1);
    setDirty(true);
    if (state.editIndex === index) state.editIndex = -1;
    dbg("删除联系人：" + (phoneId || name || "(无编号)"));
    render();
  }

  function openAdd() {
    state.editIndex = -1;
    $("editTitle").textContent = "新增联系人";
    $("editDelete").style.display = "none";
    var blank = {};
    state.config.fields.forEach(function (f) { blank[f.key] = ""; });
    buildEditForm(blank);
    $("editMask").classList.add("pb-show");
  }
  function buildEditForm(contact) {
    var form = $("editForm");
    form.innerHTML = "";
    state.config.fields.forEach(function (f, idx) {
      var fieldId = "edit-field-" + idx + "-" + safeIdPart(f.key);
      var wrap = document.createElement("div");
      wrap.id = fieldId;
      wrap.className = "pb-modal-edit-field";
      var label = document.createElement("label");
      label.id = fieldId + "-label";
      label.textContent = f.label + "（最多 " + f.maxlen + " 字符）";
      var input = document.createElement("input");
      input.id = fieldId + "-input";
      input.type = "text";
      input.maxLength = f.maxlen;
      input.value = contact[f.key] == null ? "" : contact[f.key];
      input.setAttribute("data-key", f.key);
      input.placeholder = "请输入" + f.label;
      wrap.appendChild(label);
      wrap.appendChild(input);
      form.appendChild(wrap);
    });
  }
  function contactPhoneKey(contact) {
    return String(contact && contact.phone_id != null ? contact.phone_id : "").trim();
  }

  function saveEdit() {
    var inputs = $("editForm").querySelectorAll("input");
    var obj = {};
    inputs.forEach(function (inp) { obj[inp.getAttribute("data-key")] = inp.value; });

    var phoneKey = contactPhoneKey(obj);
    if (!phoneKey) {
      alert("电话号码不能为空，电话号码用于唯一识别联系人。");
      return;
    }

    if (state.editIndex >= 0) {
      var duplicateIndex = -1;
      for (var i = 0; i < state.contacts.length; i++) {
        if (i !== state.editIndex && contactPhoneKey(state.contacts[i]) === phoneKey) {
          duplicateIndex = i;
          break;
        }
      }
      if (duplicateIndex >= 0) {
        alert("电话号码「" + phoneKey + "」已被其他联系人使用，请更换电话号码。");
        return;
      }

      state.contacts[state.editIndex] = obj;
      dbg("编辑联系人：" + phoneKey);
    } else {
      var existingIndex = -1;
      for (var j = 0; j < state.contacts.length; j++) {
        if (contactPhoneKey(state.contacts[j]) === phoneKey) {
          existingIndex = j;
          break;
        }
      }

      if (existingIndex >= 0) {
        state.contacts[existingIndex] = obj;
        dbg("新增时覆盖同电话号码联系人：" + phoneKey);
      } else {
        state.contacts.push(obj);
        dbg("新增联系人：" + phoneKey);
      }
    }

    setDirty(true);
    $("editMask").classList.remove("pb-show");
    render();
  }

  // ---------- 导入 YAML ----------
  function importYAML(text) {
    if (text.indexOf("contacts:") === -1) {
      alert("文件缺少 contacts 字段");
      return false;
    }

    var parsed = parseContactsYAML(text);
    if (parsed.error) {
      alert("YAML 解析失败：" + parsed.error);
      return false;
    }

    var fields = state.config.fields;
    var fieldKeys = fields.map(function (f) { return f.key; });

    for (var i = 0; i < parsed.contacts.length; i++) {
      var c = parsed.contacts[i];
      var keys = Object.keys(c);

      for (var j = 0; j < keys.length; j++) {
        if (fieldKeys.indexOf(keys[j]) === -1) {
          alert("第 " + (i + 1) + " 条联系人包含未知字段 '" + keys[j] + "'");
          return false;
        }
      }

      // 缺失字段按空白处理，与后端字段容错和编辑表单保持一致。
      fields.forEach(function (f) {
        if (!(f.key in c)) c[f.key] = "";
      });

      for (var k = 0; k < fields.length; k++) {
        var f = fields[k];
        var v = c[f.key] == null ? "" : String(c[f.key]);
        var charCount = Array.from(v).length;
        if (charCount > f.maxlen) {
          alert("第 " + (i + 1) + " 条，字段 " + f.key + " 超出最大长度（当前 " + charCount + " 字符，最大 " + f.maxlen + " 字符）");
          return false;
        }
      }
    }

    state.contacts = parsed.contacts;
    state.filters = {};
    state.page = 1;
    setDirty(true);
    dbg("导入 YAML：解析成功，共 " + parsed.contacts.length + " 条");
    render();
    return true;
  }

  function parseContactsYAML(text) {
    var lines = text.split(/\r?\n/);
    var contacts = [];
    var cur = null;
    var started = false;

    function pushCur() {
      if (cur) {
        contacts.push(cur);
        cur = null;
      }
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var trimmed = line.replace(/\s+$/, "");
      if (trimmed === "" || /^\s*#/.test(trimmed)) continue;

      if (!started) {
        if (/^\s*contacts\s*:/.test(trimmed)) started = true;
        continue;
      }

      var dash = trimmed.match(/^\s*-\s*(.*)$/);
      if (dash) {
        pushCur();
        cur = {};
        var after = dash[1];
        var kv = after.match(/^(\S+?)\s*:\s*(.*)$/);
        if (kv) {
          cur[kv[1]] = unquote(kv[2]);
        } else if (after !== "") {
          return { error: "第 " + (i + 1) + " 行格式错误" };
        }
        continue;
      }

      var kv2 = trimmed.match(/^\s+(\S+?)\s*:\s*(.*)$/);
      if (kv2 && cur) {
        cur[kv2[1]] = unquote(kv2[2]);
        continue;
      }

      if (cur) return { error: "第 " + (i + 1) + " 行格式错误" };
    }

    pushCur();
    if (!started) return { error: "未找到 contacts 字段" };
    if (contacts.length === 0) return { error: "未解析到任何联系人，请检查 YAML 格式" };
    return { contacts: contacts };
  }

  function unquote(s) {
    s = (s == null ? "" : String(s)).trim();
    if (s.length >= 2 && s[0] === '"' && s[s.length - 1] === '"') {
      try {
        return JSON.parse(s);
      } catch (e) {
        return s.slice(1, -1);
      }
    }
    if (s.length >= 2 && s[0] === "'" && s[s.length - 1] === "'") {
      return s.slice(1, -1).replace(/''/g, "'");
    }
    return s;
  }


  // ---------- 导出 YAML（需求4：自动补全缺失字段） ----------
  function exportYAML() {
    var header = [
      "# ============================================================",
      "# PhoneBook 通讯录数据文件",
      "# ============================================================",
      "# 使用说明：",
      "#   1. 每行一个联系人，以 \"  - \" 开头（两个空格 + 短横线 + 空格）",
      "#   2. 字段名称必须与 config.yaml 中 fields 定义的 key 完全一致",
      "#   3. 值建议用双引号包裹，避免特殊字符导致解析错误",
      "#   4. 每个字段的值不得超过 config.yaml 中定义的 maxlen 字符数",
      "#   5. 修改完成后保存此文件，替换服务器上的同名文件即可",
      "#   6. 请勿修改本注释区域",
      "# ============================================================",
      "# 字段说明："
    ];
    state.config.fields.forEach(function (f) {
      header.push("#   " + f.key + "       - " + f.label + "（最多" + f.maxlen + "字符）");
    });
    header.push("# ============================================================");
    header.push("");
    header.push("contacts:");
    var body = [];
    state.contacts.forEach(function (c) {
      // 遍历 config 全部字段，确保缺失字段以空白值补全写出
      state.config.fields.forEach(function (f, idx) {
        var v = c[f.key] == null ? "" : String(c[f.key]);
        v = v.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
        var prefix = idx === 0 ? "  - " : "    ";
        body.push(prefix + f.key + ': "' + v + '"');
      });
    });
    var content = header.concat(body).join("\n") + "\n";
    var blob = new Blob([content], { type: "text/yaml;charset=utf-8" });
    var a = document.createElement("a");
    a.id = "export-download-link";
    a.href = URL.createObjectURL(blob);
    a.download = "contacts.yaml";
    a.click();
    dbg("导出 YAML：共 " + state.contacts.length + " 条数据");
  }

  // ---------- 帮助文档（含证书说明） ----------
  function loadHelp() {
    var c = [
      "<h3 id="help-section-1">1. 软件简介</h3><p id="help-section-1-text">PhoneBook 是轻量级内部电话通讯录，服务器只提供只读数据，所有编辑在浏览器内存中完成，刷新即恢复。</p>",
      "<h3 id="help-section-2">2. 查看通讯录</h3><p id="help-section-2-text">页面加载后表格展示全部联系人，下方分页可翻页。</p>",
      "<h3 id="help-section-3">3. 搜索</h3><p id="help-section-3-text">在搜索框输入关键字，实时跨所有字段过滤，不区分大小写。</p>",
      "<h3 id="help-section-4">4. 排序</h3><p id="help-section-4-text">默认按“电话编号”升序排列；点击任意表头区域可在升序 / 降序之间循环切换。</p>",
      "<h3 id="help-section-5">5. 列筛选</h3><p id="help-section-5-text">点击表头列的「筛选」按钮打开弹框：顶部输入关键字可实时过滤选项；工具栏「全选 / 反选 / 重复项 / 唯一项」可快速勾选（重复项=本列出现多次的值，唯一项=仅出现一次的值）；勾选要保留的值后点「确定」即按该列过滤，「取消」关闭。清空筛选可先「全选」再「确定」。</p>",
      "<h3 id="help-section-6">6. 分页</h3><p id="help-section-6-text">每页条数可选 10/25/50/100，切换后跳回第 1 页；第一页固定在最左侧，最后一页固定在最右侧，便于快速跳转。</p>",
      "<h3 id="help-section-7">7. 编辑</h3><p id="help-section-7-text">点「编辑」修改联系人，仅本地生效；点「新增联系人」添加一条。</p>",
      "<h3 id="help-section-8">8. 导入 / 导出 YAML</h3><p id="help-section-8-text">导出当前数据为标准 contacts.yaml（缺失字段自动以空白值补全）；导入合法文件替换内存数据。导入会校验格式与长度。</p>",
      "<h3 id="help-section-9">9. 重要提醒</h3><p id="help-section-9-text">本地修改不会保存，刷新即恢复服务器数据；永久修改需导出后联系管理员替换服务器文件。</p>",
      "<h3 id="help-section-10">10. YAML 格式说明</h3><p id="help-section-10-text">每行一个联系人，字段名与 config.yaml 的 fields.key 一致，值建议双引号包裹，长度不超过 maxlen。</p>",
      "<h3 id="help-section-11">11. 证书警告（正常现象）</h3><p id="help-section-11-text">浏览器访问时若提示「证书不安全 / 您的连接不是私密连接」，这是<b>自签证书的正常现象</b>，并非程序故障。处理方式：点击「高级」→「继续前往（不安全）」即可正常使用。</p>",
      "<p>彻底消除提示的两种方法：① 将 <code>certs/server.crt</code> 导入系统/浏览器信任库；② 在 <code>config.yaml</code> 将 <code>https_enabled</code> 改为 <code>false</code> 走 HTTP 明文（仅限内网可信环境）。</p>",
      "<h3 id="help-section-12">12. contacts.yaml 不存在</h3><p id="help-section-12-text">若文件不存在，页面会提示。您可先「新增联系人」录入，再「导出 YAML」生成该文件，或直接「导入」一份合法文件，即可修复。</p>"
    ].join("");
    $("helpContent").innerHTML = c;
  }

  // ---------- 事件绑定 ----------
  $("searchInput").addEventListener("input", function (e) {
    state.search = e.target.value; state.page = 1; dbg("搜索：" + JSON.stringify(state.search) + "，命中 " + currentRows().length + " 条"); render();
  });
  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var name = file.name.toLowerCase();
    if (name.indexOf(".yaml") === -1 && name.indexOf(".yml") === -1) { alert("请选择 .yaml 或 .yml 文件"); e.target.value = ""; return; }
    var reader = new FileReader();
    reader.onload = function () { importYAML(String(reader.result)); e.target.value = ""; };
    reader.readAsText(file);
  });
  $("exportBtn").addEventListener("click", exportYAML);
  $("addBtn").addEventListener("click", openAdd);
  $("editCancel").addEventListener("click", function () { $("editMask").classList.remove("pb-show"); });
  $("editSave").addEventListener("click", saveEdit);
  $("editDelete").addEventListener("click", function () {
    if (state.editIndex < 0 || state.editIndex >= state.contacts.length) return;
    deleteContact(state.contacts[state.editIndex]);
    if (state.editIndex < 0) $("editMask").classList.remove("pb-show");
  });
  $("pageSize").addEventListener("change", function (e) {
    state.pageSize = parseInt(e.target.value, 10) || 25;
    state.page = 1;
    render();
  });
  $("helpBtn").addEventListener("click", function () { loadHelp(); $("helpMask").classList.add("pb-show"); });
  $("helpClose").addEventListener("click", function () { $("helpMask").classList.remove("pb-show"); });
  $("filterApply").addEventListener("click", applyFilter);
  $("filterCancel").addEventListener("click", function () { $("filterModal").classList.remove("pb-show"); });

  window.addEventListener("beforeunload", function (e) {
    if (state.dirty) { var msg = "您有未保存的修改，刷新或离开将丢失所有本地编辑。确定要离开吗？"; e.returnValue = msg; return msg; }
  });

  init();
})();
</script>
